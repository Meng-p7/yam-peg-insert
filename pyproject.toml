[project]
name = "yam-peg-insert"
version = "0.1.0"
description = "Peg-in-hole manipulation environment for I2RT YAM arm built on MuJoCo Menagerie & MjSpec"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gymnasium>=1.0.0",
  "mujoco>=3.3.0",
  "mujoco-menagerie>=2026.9.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
rl = [
  "stable-baselines3>=2.4.0",
  "torch>=2.4.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yam_peg_insert"]
